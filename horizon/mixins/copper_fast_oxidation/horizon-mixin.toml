[mod]
id = "copper_fast_oxidation"
version = "1.1.0"
priority = 100

# The commit it was tested on. It hooks only the native hook points (hooks in
# compatibility.json): the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "6560641ba51a452f6bc2407baa4eb1b3be517ca8"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "copper_fast_oxidation"
source = "runtime.rs"

[[injection]]
id = "use_on"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "use_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
