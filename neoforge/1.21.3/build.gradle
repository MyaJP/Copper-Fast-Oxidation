plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = rootProject.file('../../VERSION').text.trim()
group = 'com.miyabi'
base { archivesName = 'copper_fast_oxidation-neoforge-1.21.3' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

sourceSets.main.java.srcDirs = ['../shared/v1212/java']
sourceSets.main.resources.srcDirs = []

neoForge {
    enable {
        version = '21.3.100'
        disableRecompilation = true
    }
}

processResources {
    def p = [version: project.version, mc: '1.21.3', neo_min: '21.3']
    inputs.properties p
    from('../shared') { include 'LICENSE' }
    from('../shared') { include 'neoforge.mods.toml'; into 'META-INF'; expand p }
}
